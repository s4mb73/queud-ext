# Deploy only the queud basket API (not the full monitor bot).
# Railway dashboard → New Project → Deploy from GitHub/local → uses this config.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements-api.txt"

[deploy]
startCommand = "uvicorn queud_api.server:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
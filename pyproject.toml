[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queud-aio"
version = "0.1.0"
description = "Queud AIO — ticket monitor, checkout, and signup automation"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "beautifulsoup4",
    "curl_cffi",
    "playwright",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
queud-aio = "queud_aio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["queud_aio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rugby-sa"
version = "0.1.0"
description = "Springboks TMTickets monitor with Discord alerts and HTTP cart"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "beautifulsoup4",
    "curl_cffi",
    "playwright",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
rugby-sa = "rugby_sa.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rugby_sa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]